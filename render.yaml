# Render blueprint for the Ruyaa API.
# Dashboard: New → Blueprint, with this file at the repository root.
# Free web services sleep after 15 minutes. Free Postgres expires after 30 days.
# Use a paid web service and paid Postgres before the store goes live.

databases:
  - name: ruyaa-db
    plan: free
    region: singapore
    databaseName: ruyaaessentials
    postgresMajorVersion: "16"

services:
  - type: web
    name: ruyaa-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ruyaa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: WEBSITE_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: STORAGE_PREFIX
        value: ruyaa
